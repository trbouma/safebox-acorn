<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title description">
  <title id="title">Using your Safebox</title>
  <desc id="description">Setup-booklet diagram showing the Safebox keypad, NFC tap point, temporary Wi-Fi button, status light, Ethernet port, and USB-C power, followed by five steps: press Wi-Fi, join the temporary network, tap the Safebox Key, enter the PIN, and access the restored Safebox.</desc>
  <defs>
    <style>
      .page { fill: #f7f2e7; }
      .ink { fill: #24312a; }
      .muted { fill: #68736b; }
      .blue { fill: #3659d9; }
      .blue-dark { fill: #253c92; }
      .blue-line { stroke: #3659d9; }
      .green { fill: #667447; }
      .brown { fill: #9a5427; }
      .panel { fill: #ffffff; stroke: #d9d6ca; stroke-width: 3; }
      .device-top { fill: #3b5578; stroke: #243a58; stroke-width: 4; }
      .device-front { fill: #2d4565; stroke: #243a58; stroke-width: 4; }
      .device-side { fill: #243a58; stroke: #243a58; stroke-width: 4; }
      .key { fill: #263d5c; stroke: #6f87a5; stroke-width: 2; }
      .callout { fill: #ffffff; stroke: #3659d9; stroke-width: 4; }
      .guide { fill: none; stroke: #3659d9; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .soft-guide { fill: none; stroke: #9aa49d; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 10; }
      .step-line { stroke: #c9cec9; stroke-width: 4; }
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .h1 { font-size: 58px; font-weight: 750; letter-spacing: -1.4px; }
      .subtitle { font-size: 25px; font-weight: 450; }
      .label { font-size: 22px; font-weight: 700; }
      .small { font-size: 18px; font-weight: 500; }
      .tiny { font-size: 15px; font-weight: 650; }
      .step-title { font-size: 25px; font-weight: 750; }
      .step-copy { font-size: 18px; font-weight: 450; }
      .number { fill: #ffffff; font-size: 25px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
      .callout-number { fill: #3659d9; font-size: 25px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1c2a23" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect class="page" width="1600" height="980" rx="28"/>

  <text class="h1 ink" x="92" y="92">Using your Safebox</text>
  <text class="subtitle muted" x="92" y="134">Physical presence, your Safebox Key, and your PIN work together.</text>

  <rect class="panel" x="70" y="180" width="840" height="680" rx="30"/>
  <text class="label ink" x="112" y="231">Main interaction points</text>

  <!-- Simplified appliance -->
  <g filter="url(#shadow)">
    <path class="device-top" d="M224 395 L650 314 Q672 309 688 323 L792 414 L356 500 Z"/>
    <path class="device-front" d="M356 500 L792 414 L792 635 Q792 654 774 659 L374 735 Q356 738 356 719 Z"/>
    <path class="device-side" d="M224 395 L356 500 L356 719 Q356 738 340 727 L239 650 Q224 638 224 619 Z"/>

    <!-- keypad -->
    <g transform="translate(438 368) skewX(-18) rotate(-11)">
      <rect x="-18" y="-18" width="222" height="234" rx="20" fill="#304967" stroke="#7990ac" stroke-width="3"/>
      <g>
        <rect class="key" x="0" y="0" width="56" height="42" rx="8"/><rect class="key" x="66" y="0" width="56" height="42" rx="8"/><rect class="key" x="132" y="0" width="56" height="42" rx="8"/>
        <rect class="key" x="0" y="52" width="56" height="42" rx="8"/><rect class="key" x="66" y="52" width="56" height="42" rx="8"/><rect class="key" x="132" y="52" width="56" height="42" rx="8"/>
        <rect class="key" x="0" y="104" width="56" height="42" rx="8"/><rect class="key" x="66" y="104" width="56" height="42" rx="8"/><rect class="key" x="132" y="104" width="56" height="42" rx="8"/>
        <rect class="key" x="0" y="156" width="56" height="42" rx="8"/><rect class="key" x="66" y="156" width="56" height="42" rx="8"/><rect class="key" x="132" y="156" width="56" height="42" rx="8"/>
      </g>
      <g fill="#dbe4ec" font-size="19" font-weight="700" text-anchor="middle">
        <text x="28" y="27">1</text><text x="94" y="27">2</text><text x="160" y="27">3</text>
        <text x="28" y="79">4</text><text x="94" y="79">5</text><text x="160" y="79">6</text>
        <text x="28" y="131">7</text><text x="94" y="131">8</text><text x="160" y="131">9</text>
        <text x="28" y="183">×</text><text x="94" y="183">0</text><text x="160" y="183">✓</text>
      </g>
    </g>

    <!-- Acorn NFC badge -->
    <g transform="translate(273 544)">
      <path class="green" d="M0 4 Q30 -12 60 4 L55 23 L5 23 Z"/>
      <path class="brown" d="M7 24 H53 Q50 65 30 78 Q10 65 7 24 Z"/>
      <path d="M65 18 Q82 35 65 52 M74 9 Q101 35 74 61" fill="none" stroke="#dfe8dc" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- front ports -->
    <rect x="410" y="618" width="68" height="54" rx="5" fill="#dce3e7" stroke="#172739" stroke-width="4"/>
    <rect x="422" y="630" width="44" height="31" rx="3" fill="#172739"/>
    <rect x="513" y="617" width="79" height="35" rx="5" fill="#18283b" stroke="#b4c3cf" stroke-width="3"/>
    <rect x="526" y="625" width="53" height="9" fill="#4aa2d9"/>
    <circle cx="626" cy="625" r="7" fill="#ffffff"/>
    <rect x="659" y="586" width="52" height="59" rx="6" fill="#172739" stroke="#77889b" stroke-width="3"/>
    <circle cx="685" cy="603" r="4" fill="#ffffff"/>
    <!-- Wi-Fi physical button -->
    <circle cx="740" cy="596" r="12" fill="#18283b" stroke="#9aacc0" stroke-width="3"/>
    <path d="M724 574 Q740 560 756 574 M730 580 Q740 571 750 580 M738 586 Q740 584 742 586" fill="none" stroke="#dce6ef" stroke-width="3" stroke-linecap="round"/>
    <!-- USB-C -->
    <rect x="731" y="626" width="39" height="17" rx="8" fill="#151f2c" stroke="#c1cbd2" stroke-width="3"/>
  </g>

  <!-- callouts -->
  <path class="guide" d="M528 338 L528 278 L674 278"/>
  <circle class="callout" cx="702" cy="278" r="25"/><text class="callout-number" x="702" y="279">1</text>
  <text class="label ink" x="739" y="272">Secure keypad</text>
  <text class="small muted" x="739" y="299">Enter the Safebox PIN</text>

  <path class="guide" d="M292 566 L169 566 L169 636"/>
  <circle class="callout" cx="169" cy="665" r="25"/><text class="callout-number" x="169" y="666">2</text>
  <text class="label ink" x="111" y="711">NFC tap point</text>
  <text class="small muted" x="111" y="738">Present the Safebox Key</text>

  <path class="guide" d="M740 596 L838 596 L838 675"/>
  <circle class="callout" cx="838" cy="704" r="25"/><text class="callout-number" x="838" y="705">3</text>
  <text class="label ink" text-anchor="end" x="800" y="750">Wi-Fi pairing</text>
  <text class="small muted" text-anchor="end" x="800" y="777">Press to open a short window</text>

  <path class="soft-guide" d="M443 676 L443 791 L574 791"/>
  <text class="tiny muted" x="590" y="797">Optional Ethernet</text>
  <path class="soft-guide" d="M751 644 L751 826 L574 826"/>
  <text class="tiny muted" x="590" y="832">USB-C power</text>

  <!-- interaction sequence -->
  <rect class="panel" x="950" y="180" width="580" height="680" rx="30"/>
  <text class="label ink" x="996" y="231">Local access sequence</text>
  <line class="step-line" x1="1030" y1="297" x2="1030" y2="716"/>

  <g>
    <circle class="blue" cx="1030" cy="300" r="29"/><text class="number" x="1030" y="301">1</text>
    <text class="step-title ink" x="1080" y="294">Press the Wi-Fi button</text>
    <text class="step-copy muted" x="1080" y="324">A short-lived local SSID appears.</text>

    <circle class="blue" cx="1030" cy="403" r="29"/><text class="number" x="1030" y="404">2</text>
    <text class="step-title ink" x="1080" y="397">Join the local network</text>
    <text class="step-copy muted" x="1080" y="427">Only the restricted pairing page is available.</text>

    <circle class="green" cx="1030" cy="506" r="29"/><text class="number" x="1030" y="507">3</text>
    <text class="step-title ink" x="1080" y="500">Tap the Safebox Key</text>
    <text class="step-copy muted" x="1080" y="530">The secure credential proves possession.</text>

    <circle class="brown" cx="1030" cy="609" r="29"/><text class="number" x="1030" y="610">4</text>
    <text class="step-title ink" x="1080" y="603">Enter the PIN</text>
    <text class="step-copy muted" x="1080" y="633">The keypad confirms knowledge locally.</text>

    <circle class="blue-dark" cx="1030" cy="712" r="29"/><text class="number" x="1030" y="713">5</text>
    <text class="step-title ink" x="1080" y="706">Safebox is ready</text>
    <text class="step-copy muted" x="1080" y="736">Attach locally or restore from encrypted replicas.</text>
  </g>

  <rect x="986" y="774" width="508" height="60" rx="15" fill="#eef1ea" stroke="#ccd3c9" stroke-width="2"/>
  <path d="M1016 806 L1028 818 L1050 790" fill="none" stroke="#667447" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="small ink" x="1072" y="799">The temporary Wi-Fi network never unlocks</text>
  <text class="small ink" x="1072" y="824">keys, funds, or records by itself.</text>

  <text class="tiny muted" x="92" y="925">Concept diagram — final hardware, labels, and pairing behavior may change during engineering and security review.</text>
</svg>
